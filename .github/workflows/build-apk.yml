name: Build HOTWAV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q HOTWAV_LIVE_DEMO_Project.zip
          cd HOTWAV_LIVE_DEMO
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HOTWAV-LIVE-DEMO-APK
          path: HOTWAV_LIVE_DEMO/app/build/outputs/apk/debug/app-debug.apk
